schema_version: 2

# Product dependencies are installed inside each project workspace. This keeps
# external capabilities declarative and versioned with the product instead of
# adding per-product backend code. The agent receives only attached skills;
# the rest stay in skills/ for progressive disclosure.
dependencies:
  skills:
    - id: hyperframes-skills
      installer: skills-cli
      source: heygen-com/hyperframes
      # Install the official core plus routes used by product-infographic.
      install:
        - hyperframes
        - hyperframes-core
        - hyperframes-animation
        - hyperframes-creative
        - hyperframes-cli
        - media-use
        - hyperframes-registry
        - hyperframes-keyframes
        - general-video
        - product-launch-video
        - faceless-explainer
        - motion-graphics
      attach: [hyperframes]
      refresh_hours: 24

  # npx provides the renderer CLI itself. Verification both fetches the
  # package on first use and confirms the project's native tooling is ready.
  cli:
    - id: hyperframes-cli
      package:
        ecosystem: npm
        name: hyperframes
        version: latest
      execution:
        mode: npx
        binary: hyperframes
      verify:
        args: [doctor, --json]
        # HyperFrames reports optional TTS/music/Docker failures in JSON while
        # still returning status zero. Only these local-render prerequisites
        # block a Video Studio project from starting production.
        required_json_checks: [Version, Node.js, FFmpeg, FFprobe, Chrome]
      refresh_hours: 24
      permissions:
        network: true
        write_paths: [work/, outputs/, runs/]

  # Future integrations are declared here. A concrete enabled server is
  # connected by the shared agent runtime, which resolves environment values
  # from AgentWorks secrets rather than storing values in this file.
  mcp_servers: []

prompt:
  file: prompts/system-prompt.md
  variables:
    PRODUCT_NAME: Video Studio

# Declarative product composition. The IDs below reference shared AgentWorks
# skills/tools and registered product implementations; no executable code lives
# in this file.
profile:
  id: video-studio
  name: Video Studio
  version: 2
  skills:
    - product-infographic
    - video-creation
    - video-editing
    - video-quality
    - hyperframes-quality
    - html-composition
    - hyperframes
    - agent-browser
  tools:
    - id: video.show-video
      # Declares what this tool shows, not how. The frontend renderer
      # registered for this kind (getPresentationRenderer) and the
      # tool's own factory (which reads this at construction rather
      # than hardcoding it) both key off this one value. See
      # pkg/presentations and docs/design/agent_tool_surface_single_source.md.
      presentation:
        kind: media.video
  tool_policy:
    # Video Studio names the tools it needs. Everything AgentWorks registers that
    # is not listed here never reaches the agent.
    #
    # This is an allow list rather than the old `disabled:` deny list because a
    # deny list silently widens: every new platform tool reaches this product
    # until someone remembers to block it. Naming the surface also makes the
    # registered set and what get_api_spec advertises the same thing, which is
    # what stopped set_workflow_secret from being registered-but-invisible.
    # See docs/design/agent_tool_surface_single_source.md.
    #
    # Not listed, deliberately: AgentWorks provider/model, skill and MCP-server
    # administration; the shared media/LLM bridge tools; sub-agent orchestration
    # (delegate, query_agent, list_agents, terminate_agent); every schedule tool;
    # and human_feedback / notify_user.
    #
    # Two surfaces this list does not govern: mcpagent's intrinsic tools
    # (get_api_spec, get_prompt, get_resource, read_skill), which it injects
    # itself, and the coding CLI's own native tools under agent_tools.mode
    # Hybrid — Video Studio also has provider-native tools for workspace work.
    # Product HTTP APIs still go through the shared shell bridge, because every
    # provider can call it as an MCP tool. Reaching them from each CLI's OWN
    # shell was tried and reverted: see
    # docs/design/product_api_transport_for_coding_agents.md.
    mode: allowlist
    enabled:
      # The product's own control.
      - show_video
      # The bridge shell is how product HTTP APIs are called. Every provider can
      # reach it (Codex only through its JS code-mode sandbox, which has no
      # network and no env of its own), so it is not redundant with the CLI's
      # native shell.
      - execute_shell_command
      # Managed browser capability, matching the agent-browser skill above.
      - agent_browser
      # Project and user secret CRUD. ui.secrets is required for this product.
      - list_secrets
      - set_workflow_secret
      - delete_workflow_secret
      - set_user_secret
      - delete_user_secret
      # Running the production pipeline and inspecting it.
      - run_full_workflow
      - execute_step
      - query_step
      - send_step_message
      - stop_step
      - stop_all_executions
      - list_executions
  runtime:
    # Video Studio is a non-technical surface. Every supported coding provider
    # runs through its native structured JSON protocol: tool calls, usage, and
    # completion are typed events rather than terminal-pane scraping.
    transport: structured
    provider: claude-code
    model_id: claude-sonnet-5
    # hybrid: native CLI tools (Read/Write/Shell) handle project file work;
    # the guarded AgentWorks MCP bridge (api-bridge) handles product control
    # (execute_step, show_video, secrets, etc). See the mode table in
    # docs/design/video_studio_inside_agentworks.md.
    #
    # A prior investigation into apparent hybrid-mode failures (native tools
    # running unblocked, "product shell not connected" errors) root-caused
    # them to a bug unrelated to this mode setting: the structured Cursor CLI
    # adapter never created a git-root marker in the project working
    # directory, so cursor-agent walked up to the enclosing monorepo root
    # looking for .cursor/mcp.json, found nothing there, and silently never
    # connected the api-bridge MCP server on ANY mode. That's fixed in
    # cursorcli_structured_adapter.go (mirrors the tmux adapter's existing
    # cursorWorkingDirIsGitRoot/initCursorWorkspaceGitMarker fix). With the
    # bridge actually reachable, re-testing hybrid here.
    #
    # hybrid + compatibility is documented as valid only "for a trusted local
    # developer machine" and "must never be silently selected for hosted or
    # multi-user deployments" — native tools aren't constrained by
    # FolderGuard the way MCP tools are.
    #
    # Product HTTP APIs go through the bridge shell either way —
    # api_transport.native_shell is implemented and left OFF; see
    # docs/design/product_api_transport_for_coding_agents.md.
    agent_tools:
      mode: hybrid
    approvals:
      mode: provider_auto
    # Where this product's artifacts belong, in its own vocabulary, keyed by the
    # tool the advice is for. Declared here rather than left to the shared
    # default, which is AgentWorks' layout — plan folders and pulse/goals.html —
    # for concepts Video Studio does not have. Only execute_shell_command is
    # listed because it is the only writing tool this product exposes;
    # diff_patch_workspace_file is deliberately not in the allow list above.
    # Keep in step with prompts/system-prompt.md, which tells the agent the same
    # thing; the tool description is what it re-reads on every get_api_spec.
    workspace:
      placement:
        execute_shell_command:
          - "Uploaded references live in `uploads/` and are read-only — never modify them."
          - "Direct-chat work belongs in `work/`; finished exports belong in `outputs/`."
          - "Workflow steps write inside their own run folder, not at the project root."
    provider_options:
      - id: claude-code
        label: Claude Code
        provider: claude-code
        model_id: claude-sonnet-5
        default: true
      - id: codex
        label: Codex
        provider: codex-cli
        model_id: gpt-5.6-terra
      - id: cursor
        label: Cursor
        provider: cursor-cli
        model_id: auto
    capabilities:
      # Structured turns are one-shot processes. Follow-ups queue at a safe
      # boundary; they are never typed into a live terminal prompt.
      live_input: disabled
      raw_terminal: disabled
      warm_session: preferred
      workflow_execution: required
      browser: required
      secrets: required
  built_in: true

branding:
  icon: video-studio
  favicon: /video-studio-favicon.svg

ui:
  surface: video-studio
  files_panel: true
  workflow_panel: true
  secrets: true
  streaming: structured

workflows:
  enabled: [infographic, quality]
  selected_skills:
    - product-infographic
    - video-creation
    - video-editing
    - video-quality
    - hyperframes-quality
    - html-composition
    - hyperframes
    - agent-browser
  browser_mode: auto
