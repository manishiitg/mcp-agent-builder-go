schema_version: 2

# Chief of Staff has no per-project workspace to provision -- it is global
# (profile.scope: global below), operating across the user's whole workspace
# rather than one project folder. Unlike Video Studio, there is nothing to
# install here.
dependencies: {}

prompt:
  # This file is a short placeholder, not the real prompt. Chief of Staff
  # deliberately keeps its live system prompt on the dynamic path
  # (GetMultiAgentDelegationInstructionsWithUser in
  # cmd/server/virtual-tools/delegation_tools.go), which needs per-request
  # parameters -- chatsFolder, spawn capabilities, delegation-tier config, the
  # full reference surface -- that a static product.yaml template cannot
  # express. This file exists only to satisfy agentprofiles.Validate()'s
  # requirement that a profile declare a non-empty, parseable system prompt;
  # it is never actually rendered into a live conversation. See
  # cmd/server/server.go's prompt assembly step 1, which checks
  # isGlobalScopedProfile before deciding which prompt source to use.
  file: prompts/system-prompt.md
  variables: {}

profile:
  id: chief-of-staff
  name: Chief of Staff
  version: 1
  # The load-bearing field. Every other product profile is project-scoped by
  # default (empty Scope == "project"); Chief of Staff is the first to declare
  # "global" -- no single project workspace, keeps the same chat-wide grants
  # (including org-owned pulse/ writes) and workspace description a
  # profile-less multi-agent turn already has. See
  # agentprofiles.Profile.EffectiveScope and its callers in
  # cmd/server/agent_profile_runtime.go / server.go.
  scope: global
  # Slash commands this product ships with itself, like Video Studio's own --
  # each prompt lives in its own file under commands/ rather than inline here,
  # resolved by agentprofiles.ResolveCommandPrompts at load time.
  # notify and org-backup moved here from the old chiefOfStaffOnly-gated
  # entries in frontend/src/commands/builtin-commands.tsx. workflow-builder
  # was NOT moved -- this profile is read-only over Workflow/ (see
  # create_workflow's exclusion from tools below), so a command that only
  # exists to call create_workflow has no home here; it was removed outright.
  commands:
    - name: notify
      description: Set up, review, or test agentic Chief of Staff notifications
      icon: bell-ring
      file: commands/notify.md
    - name: org-backup
      description: Set up or run backup for Chief of Staff tasks and org config
      icon: cloud
      file: commands/org-backup.md
  # Secrets and Schedules panels in Chief of Staff's own header/aside, the
  # same controls Video Studio's header already offers -- read over the wire
  # via GET /api/agent-profiles/{id} so the frontend doesn't hardcode what
  # this product shows.
  ui_panels:
    secrets: true
    schedules: true
    files: true
  # Skills ARE declared here, like Video Studio's own -- each
  # name is individually registered by RegisterProductSkills()
  # (profile_definition.go), rendered once from the same shared reference-doc
  # templates the old mode-gated AttachReferenceSurface bundle drew from
  # (guidance.MaterializeReferenceKindsAsSkills), not duplicated content.
  # Deliberately excluded, see profile_definition.go's chiefOfStaffSkillNames
  # comment for why: org-goals/org-html/org-pulse (goals feature, dropped)
  # and llm-provider-config (workspace LLM/credential catalog management --
  # a builder/workshop task, not a read-only ops-chat one).
  skills:
    - stores
    - file-layout
    - skill-management
    - delegation
    - schedule-management
    - secret-management
    - html-output
    - browser-usage
    - mcp-bridge
    - workspace-media-tools
    - debugging-flow
    - publish-strategy
    - backup-strategy
  # get_activity_status and update_chief_of_staff_notifications are
  # registered as ToolFactory entries at server startup
  # (chief_of_staff_tool_factories.go) -- their handlers are deeply coupled to
  # *StreamingAPI internals (scheduler, chat store, notification config), the
  # same reason Video Studio's own tools live in a factory rather than being
  # inlined here. Binding them here is what makes registerAgentProfileTools
  # actually build and register them for a chief-of-staff chat; the legacy
  # no-profile chat keeps getting them through the separate manual
  # isChiefOfStaffChat block in server.go, unaffected by this list.
  #
  # create_workflow is deliberately NOT bound here: this profile is read-only
  # over Workflow/ (see "Core purpose" in
  # docs/design/chief_of_staff_as_product.md), and creating a workflow is a
  # write. The legacy no-profile chat still has it, unaffected.
  tools:
    - id: chief-of-staff.activity-status
    - id: chief-of-staff.update-notifications
  # tool_policy is deliberately OMITTED, not "allowlist". Chief of Staff's
  # tool surface is the platform's broadest and still evolving (delegate,
  # schedules, notify_user, secrets, workflow admin, activity status...);
  # hand-maintaining an allowlist for a surface this dynamic would be exactly
  # the deny-list drift problem the allowlist pattern (see Video Studio's own
  # tool_policy comment) was built to avoid, applied to a case it doesn't fit.
  # Empty mode is the existing legacy behavior: every platform tool reaches
  # the agent except an explicit Disabled list, which stays empty too --
  # identical to what a profile-less chat already gets today.
  runtime:
    # Default model for a brand-new chat only -- NOT an authoritative pin the
    # way Video Studio's own runtime.provider/model_id is. Chief of Staff is
    # meant to feel like a profile-less chat: the user's own chat-level model
    # selection (any published LLM, via the same picker every multi-agent
    # chat already has in ChatInput) wins once one exists. This is
    # scope-gated in resolveAgentProfileForQuery (agent_profile_runtime.go),
    # not a property of the runtime.provider/model_id fields themselves --
    # Video Studio's identical-looking fields stay authoritative because its
    # profile is project-scoped, not global.
    provider: claude-code
    model_id: claude-sonnet-5
    # provider_options is deliberately NOT declared. That mechanism curates a
    # small fixed list and makes it authoritative (see Video Studio's own
    # provider_options) -- the opposite of what Chief of Staff wants, which is
    # the full published-LLM catalog, unrestricted.
    #
    # transport, agent_tools, approvals, api_transport, and capabilities are
    # all deliberately left unset. Chief of Staff should behave exactly like
    # today's profile-less multi-agent chat for every facet this profile
    # doesn't explicitly opt into -- an empty/zero value here is what makes
    # every downstream branch that reads resolvedProfile.Definition.Runtime
    # fall through to the same behavior a nil profile already gets, not a
    # narrower one.
  built_in: true

branding:
  # No bespoke mark exists for Chief of Staff the way Video Studio has
  # VideoStudioMark -- reuse the existing lucide Users identity already used
  # at frontend/src/constants/modeInfo.tsx for the 'multi-agent' mode card.
  icon: chief-of-staff
  favicon: ""

ui:
  surface: chief-of-staff
  # No project concept, so no per-project files/workflow panels -- the
  # automations-oversight dashboard (a later, separate piece of work) is the
  # product's home screen, not a files/workflow panel bolted onto the chat.
  files_panel: false
  workflow_panel: false
  secrets: true
  streaming: structured

# Chief of Staff dispatches to workflows the user runs manually -- it does
# not ship or run any fixed pipeline of its own (unlike Video Studio's four
# production pipelines). Its own system prompt already says as much: "Chief
# of Staff does not run workflows directly right now." Left empty rather than
# omitted so the intent is explicit, not accidental.
workflows:
  enabled: []
  selected_skills: []
  browser_mode: ""

# No FIXED schedules declared here -- that's a different thing from the
# ui_panels.schedules panel above. The built-in Org Pulse job was removed
# entirely (it was goal-alignment-centric end to end, and goals are dropped),
# not ported back; Chief of Staff ships with zero built-in schedules of its
# own. A user's own scheduled Chief of Staff tasks still show up in the
# Schedules panel -- that panel lists what's actually scheduled, it doesn't
# require this product to declare any itself. A schedules: product.yaml
# capability for a product to declare its OWN fixed schedules (the way
# workflows: above declares fixed pipelines) remains a separate, not yet
# built idea.
