schema_version: 2

# Finance has no per-project workspace to provision the way Video Studio
# does -- it reads a fixed set of existing finance workflows via its one
# tool, not a project folder. Still scope: project, not global -- see the
# profile.scope comment below for why that distinction matters here.
dependencies: {}

prompt:
  file: prompts/system-prompt.md
  variables: {}

profile:
  id: finance
  name: Finance
  version: 1
  # Project-scoped, NOT global -- despite Finance spanning several sources
  # the same way Chief of Staff spans several workflows. Two reasons this
  # profile needs project scope specifically, discovered empirically
  # (2026-08-16), not assumed by analogy to Chief of Staff:
  #   1. Global scope makes provider_options non-authoritative by design
  #      (resolveAgentProfileForQuery: "isGlobalScope && requestHasExplicitModel"
  #      lets the user's own chat-level selection win outright, always --
  #      exactly what Chief of Staff wants, and exactly what defeats the
  #      provider restriction below).
  #   2. Global scope takes the dynamic multi-agent delegation prompt
  #      instead of this product's own prompt.file -- confirmed live: an
  #      earlier global-scoped version of this profile never actually sent
  #      prompts/system-prompt.md to the model at all.
  # Project scope's usual narrowing (folder guard collapsed to one root,
  # chat-wide grants dropped) is a non-issue here: this profile's one tool
  # (finance.query-source) bypasses FolderGuard entirely -- it queries a
  # fixed, hardcoded path whitelist (finance_query_tool.go), never the
  # general filesystem -- so there is nothing project scope could narrow
  # that this profile was using anyway.
  scope: project
  # No commands, no ui_panels, no skills -- the dashboard itself
  # (frontend/src/products/finance/FinanceSurface.tsx) is pure frontend
  # with no dependency on this profile at all; this profile exists solely
  # to run the read-only chat panel alongside it.
  tools:
    - id: finance.query-source
  # Deliberately narrower than a workflow's own `run` mode, which still
  # carries execute_shell_command/diff_patch_workspace_file as "always
  # available regardless of mode" -- see the load-bearing finding in
  # docs/design/workflow_custom_ui_product.md's Gap 1. This profile's
  # allowlist is the real, server-enforced boundary that finding calls
  # for: only the one read-only query tool this product needs, plus the
  # one call path to it -- no file writes, no delegation, no schedules, no
  # workflow execution. mcpagent's own intrinsic tools (get_api_spec,
  # get_prompt, get_resource, read_skill) are injected by mcpagent itself
  # and are not governed by this list -- see Video Studio's own
  # tool_policy comment for why.
  #
  # execute_shell_command is included alongside the one product tool --
  # NOT for general shell use, but because it's the platform's only call
  # path to a custom tool: every product's custom tool is reached via
  # get_api_spec discovery + execute_shell_command + curl to
  # $MCP_CUSTOM/<tool>, the same pattern Video Studio's own product.yaml
  # documents ("Product HTTP APIs still go through the shared shell
  # bridge, because every provider can call it as an MCP tool"). This
  # file originally omitted it on the belief that Finance needed "no
  # shell" -- that made query_finance_source genuinely unreachable via
  # the standard route, discovered and confirmed live building Dominion,
  # which had the identical gap ("tools_unavailable:
  # unknown=[execute_shell_command]" on the model's own attempt). This
  # does widen the profile beyond a literal read-only-query surface (the
  # shell itself is not scoped to curl-only), so the system prompt
  # explicitly narrows its intended use to calling query_finance_source --
  # see prompts/system-prompt.md.
  tool_policy:
    mode: allowlist
    enabled:
      - query_finance_source
      - execute_shell_command
  runtime:
    # NOT the security boundary -- corrected 2026-08-17 after a second
    # false lead. `agent_tools.mode: mcp_only` below is what actually
    # contains a coding CLI, transport-independently; this setting is a
    # separate axis kept for turn-structure/debuggability reasons only.
    # Two corrections layered on each other here, in order:
    #   1. (2026-08-16) Believed transport: structured was required
    #      because a codex-cli finance chat, before this was set, made 12
    #      tool calls outside the registered [query_finance_source
    #      read_skill web_fetch web_search] set. Also wrongly claimed
    #      Video Studio already pinned transport: structured -- checked
    #      directly, it actually ships transport: auto.
    #   2. (2026-08-17) Re-tested live with the ACTUAL fix
    #      (agent_tools.mode: mcp_only, see below) under transport: auto
    #      (native/tmux) against a fresh codex-cli session: 12 `exec` tool
    #      calls still occurred, but every one resolved through
    #      get_api_spec / the code-execution-mode HTTP bridge -- the same
    #      registered-tool surface tool_policy governs -- not a raw host
    #      shell. A node_repl attempt was flatly rejected: "unknown=
    #      [node_repl]: not registered by any currently connected server."
    #      No unauthorized tool call ever executed. That means the
    #      original 12-tool-call leak almost certainly happened while this
    #      profile was still scope: global (see the profile.scope comment
    #      above) -- global scope was independently confirmed to break
    #      provider_options/prompt binding, so the REGISTERED tool set
    #      itself was plausibly broader than intended at the time, not
    #      that transport let codex bypass a correctly-scoped tool_policy.
    # transport: structured is kept anyway -- turn-based, easier to
    # reason about and debug than a long-lived tmux session -- but it is
    # not doing the security work this comment used to credit it with.
    transport: structured
    # Curated to exactly one provider. A second tool was reached for live
    # (2026-08-16), independent of transport: `nodeRepl`/`js`, with a
    # working `fetch` and a real filesystem `cwd`. This is docs/bugs/
    # hybrid_profile_told_it_has_no_shell.md's section 4, "personal MCP
    # servers leak into product sessions" -- tools.mcp__node_repl__js,
    # sourced from a developer's personal ~/.codex/config.toml, NOT
    # codex-cli's own intrinsic toolset. Very likely a local-dev-machine
    # artifact, not something a real deployed user would hit -- the
    # already-tracked fix (--ignore-user-config or an isolated CODEX_HOME)
    # is unresolved platform-wide, not specific to this profile, and did
    # NOT reproduce in the 2026-08-17 re-test (a fresh machine/session
    # without that personal server configured). Even so: curated to one
    # verified provider anyway, since that doesn't retroactively prove
    # codex-cli/cursor-cli safe under a real allowlist for real financial
    # data -- untested beyond this one re-test.
    provider_options:
      - id: claude-code
        label: Claude Code
        provider: claude-code
        model_id: claude-sonnet-5
        default: true
    # THIS is the real, transport-independent security boundary, verified
    # live 2026-08-17: mcpagent's mcp_only path calls
    # WithCodexDisableShellTool() for codex-cli (mcpagent/agent/
    # coding_agent_integrations.go:146-148), which disables codex's native
    # shell_tool via codex's own CLI `--disable` flags -- confirmed in the
    # actual tmux launch command (`--disable shell_tool --disable
    # unified_exec ... --disable computer_use`). This runs unconditionally
    # in appendCodexCLIIntegrationOptions regardless of transport. What's
    # left (codex's code-execution-mode `exec` harness) is itself
    # constrained to calling only the registered/tool_policy-gated tool
    # set via the HTTP bridge -- confirmed by the node_repl rejection
    # above. This DOES match Video Studio's actual current value (verified
    # directly) -- though Video Studio's own tool_policy comment describes
    # this setting as "Hybrid", contradicting its own runtime.agent_tools.
    # mode: mcp_only a few lines below it, an internal doc-drift in Video
    # Studio's own file, not resolved here. Given this correction, Video
    # Studio's transport: auto + agent_tools.mode: mcp_only combination is
    # NOT the live gap an earlier version of this comment flagged it as --
    # mcp_only appears to correctly contain codex-cli regardless of
    # transport, matching what was found here.
    agent_tools:
      mode: mcp_only
    provider: claude-code
    model_id: claude-sonnet-5
  built_in: true

branding:
  icon: finance
  favicon: ""

ui:
  surface: finance
  files_panel: false
  workflow_panel: false
  secrets: false
  streaming: structured

workflows:
  enabled: []
  selected_skills: []
  browser_mode: ""
