schema_version: 2

# Finance has no per-project workspace to provision the way Video Studio
# does -- it reads a fixed set of existing finance workflows via its one
# tool, not a project folder. Still scope: project, not global -- see the
# profile.scope comment below for why that distinction matters here.
dependencies: {}

prompt:
  file: prompts/system-prompt.md
  variables: {}

profile:
  id: finance
  name: Finance
  version: 1
  # Project-scoped, NOT global -- despite Finance spanning several sources
  # the same way Chief of Staff spans several workflows. Two reasons this
  # profile needs project scope specifically, discovered empirically
  # (2026-08-16), not assumed by analogy to Chief of Staff:
  #   1. Global scope makes provider_options non-authoritative by design
  #      (resolveAgentProfileForQuery: "isGlobalScope && requestHasExplicitModel"
  #      lets the user's own chat-level selection win outright, always --
  #      exactly what Chief of Staff wants, and exactly what defeats the
  #      provider restriction below).
  #   2. Global scope takes the dynamic multi-agent delegation prompt
  #      instead of this product's own prompt.file -- confirmed live: an
  #      earlier global-scoped version of this profile never actually sent
  #      prompts/system-prompt.md to the model at all.
  # Project scope's usual narrowing (folder guard collapsed to one root,
  # chat-wide grants dropped) is a non-issue here: this profile's one tool
  # (finance.query-source) bypasses FolderGuard entirely -- it queries a
  # fixed, hardcoded path whitelist (finance_query_tool.go), never the
  # general filesystem -- so there is nothing project scope could narrow
  # that this profile was using anyway.
  scope: project
  # No commands, no ui_panels, no skills -- the dashboard itself
  # (frontend/src/products/finance/FinanceSurface.tsx) is pure frontend
  # with no dependency on this profile at all; this profile exists solely
  # to run the read-only chat panel alongside it.
  tools:
    - id: finance.query-source
  # Deliberately narrower than a workflow's own `run` mode, which still
  # carries execute_shell_command/diff_patch_workspace_file as "always
  # available regardless of mode" -- see the load-bearing finding in
  # docs/design/workflow_custom_ui_product.md's Gap 1. This profile's
  # allowlist is the real, server-enforced boundary that finding calls
  # for: only the one read-only query tool this product needs, plus the
  # one call path to it -- no file writes, no delegation, no schedules, no
  # workflow execution. mcpagent's own intrinsic tools (get_api_spec,
  # get_prompt, get_resource, read_skill) are injected by mcpagent itself
  # and are not governed by this list -- see Video Studio's own
  # tool_policy comment for why.
  #
  # execute_shell_command is included alongside the one product tool --
  # NOT for general shell use, but because it's the platform's only call
  # path to a custom tool: every product's custom tool is reached via
  # get_api_spec discovery + execute_shell_command + curl to
  # $MCP_CUSTOM/<tool>, the same pattern Video Studio's own product.yaml
  # documents ("Product HTTP APIs still go through the shared shell
  # bridge, because every provider can call it as an MCP tool"). This
  # file originally omitted it on the belief that Finance needed "no
  # shell" -- that made query_finance_source genuinely unreachable via
  # the standard route, discovered and confirmed live building Dominion,
  # which had the identical gap ("tools_unavailable:
  # unknown=[execute_shell_command]" on the model's own attempt). This
  # does widen the profile beyond a literal read-only-query surface (the
  # shell itself is not scoped to curl-only), so the system prompt
  # explicitly narrows its intended use to calling query_finance_source --
  # see prompts/system-prompt.md.
  tool_policy:
    mode: allowlist
    enabled:
      - query_finance_source
      - execute_shell_command
  runtime:
    # Load-bearing, and NOT a case of matching an existing Video Studio
    # precedent -- checked directly (2026-08-16): Video Studio's own
    # shipped product.yaml sets transport: auto, not structured. A doc
    # (product_api_transport_for_coding_agents.md) claimed otherwise; that
    # claim was wrong (or stale) and was repeated here uncritically before
    # being caught and corrected. codingAgentUsesStructuredTransport (what
    # "auto"/unset resolves to) returns true ONLY for cursor-cli -- every
    # other provider, including codex-cli AND claude-code, defaults under
    # Video Studio's own config to native/interactive (tmux) mode, where
    # the coding CLI runs with its own full built-in tool loop entirely
    # outside mcpagent's tool registry, so tool_policy does not apply.
    # Whether that already matters for Video Studio in practice (its own
    # tool_policy allowlist already includes broad file/shell-adjacent
    # tools like diff_patch_workspace_file, so the blast-radius delta of
    # native tools additionally being available is smaller there) was not
    # tested here and is a real open question about Video Studio's own
    # current configuration, not just Finance's. Confirmed live for this
    # profile specifically (2026-08-16): before this setting, a finance
    # chat on codex-cli made 12 tool calls outside the registered
    # [query_finance_source read_skill web_fetch web_search] set.
    transport: structured
    # Curated to exactly one provider, deliberately -- NOT "any published
    # LLM" the way Chief of Staff's identical-looking runtime.provider is.
    # A second tool was reached for live (2026-08-16), independent of the
    # transport fix above: `nodeRepl`/`js`, with a working `fetch` and a
    # real filesystem `cwd`. This is docs/bugs/hybrid_profile_told_it_has_
    # no_shell.md's section 4, "personal MCP servers leak into product
    # sessions" -- tools.mcp__node_repl__js, sourced from a developer's
    # personal ~/.codex/config.toml, NOT codex-cli's own intrinsic
    # toolset. Very likely a local-dev-machine artifact, not something a
    # real deployed user would hit -- the already-tracked fix
    # (--ignore-user-config or an isolated CODEX_HOME) is unresolved
    # platform-wide, not specific to this profile. Even so: that doesn't
    # retroactively prove codex-cli (or cursor-cli, untested here) is safe
    # under a real allowlist for a product whose stakes are real financial
    # data. claude-code's own safety under this exact combination
    # (transport: structured + agent_tools: mcp_only) is Finance's OWN
    # direct evidence, not inferred from Video Studio -- Video Studio's
    # own claude-code sessions run under a different transport (native/
    # tmux, per transport: auto above), so its production usage does not
    # actually validate this specific combination. What was observed:
    # PRODUCT_TOOL_GATE correctly admitted only query_finance_source and
    # filtered 55 other tools across two clean live turns, with no
    # unauthorized tool call. Two turns is not exhaustive or adversarial
    # testing -- see docs/design/finance_dashboard_product.md.
    provider_options:
      - id: claude-code
        label: Claude Code
        provider: claude-code
        model_id: claude-sonnet-5
        default: true
    # This DOES match Video Studio's actual current value (verified
    # directly, 2026-08-16) -- though Video Studio's own tool_policy
    # comment describes this setting as "Hybrid", which contradicts its
    # own runtime.agent_tools.mode: mcp_only a few lines below it. That
    # internal contradiction in Video Studio's own file was not resolved
    # here; do not build further reasoning on which of the two is
    # authoritative without checking again. Confirmed live for Finance
    # (codex-cli, before the transport fix): mode resolved to mcp_only
    # (logged hybrid=false) and it still did not stop the native `exec`/
    # `js` leaks -- mcp_only's enforcement mechanism does not appear to
    # apply under native/tmux transport, only under structured.
    agent_tools:
      mode: mcp_only
    provider: claude-code
    model_id: claude-sonnet-5
  built_in: true

branding:
  icon: finance
  favicon: ""

ui:
  surface: finance
  files_panel: false
  workflow_panel: false
  secrets: false
  streaming: structured

workflows:
  enabled: []
  selected_skills: []
  browser_mode: ""
