name: SparkQuill DMG

# Separate from "Desktop DMG" (AgentWorks) on purpose: the two apps ship
# independently, on their own tags, and neither should be blocked or
# re-released by a change to the other.
#
# Tags are namespaced `sparkquill-v*` so they can't collide with AgentWorks'
# plain `v*` tags in the same repo.
#
# SparkQuill runs on the platform binaries (agent-server + workspace-server,
# docs/design/sparkquill_desktop_on_platform_plan.md), so this builds the same
# two servers the AgentWorks desktop builds and stages the learning app as the
# agent server's static site. The Electron shell shares its mechanics with
# ../desktop through desktop/lib (a file: dependency), which is why that
# directory is in the trigger paths.
on:
  push:
    branches:
      - main
      - codex/family-learning-prd
    tags:
      - 'sparkquill-v*'
  pull_request:
    paths:
      - 'desktop-sparkquill/**'
      - 'desktop/lib/**'
      - 'agent_go/**'
      - 'workspace/**'
      - 'frontend/**'
      - 'scripts/build-darwin-voice-binary.sh'
      - '.github/workflows/sparkquill-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sparkquill-dmg-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15-intel
    permissions:
      # Only the tag build needs write, but the job is shared; the publish step
      # itself is gated on the tag below.
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout MCPAgent dependency
        uses: actions/checkout@v4
        with:
          repository: manishiitg/mcpagent
          path: deps/mcpagent

      - name: Checkout LLM provider dependency
        uses: actions/checkout@v4
        with:
          repository: manishiitg/llm-provider-mcp
          path: deps/multi-llm-provider-go

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # One frontend: SparkQuill is a product surface of the main build
      # (frontend/src/products/sparkquill), pinned by the runtime config the
      # shell passes the agent server.
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # The agent server serves ./static (relative to its resources dir) as the
      # product's site; desktop-sparkquill/main.js points STATIC_DIR there.
      - name: Stage the frontend into the app bundle
        run: |
          rm -rf desktop-sparkquill/resources/static
          mkdir -p desktop-sparkquill/resources/static
          cp -R frontend/dist/. desktop-sparkquill/resources/static/

      - name: Stage the default MCP config
        run: |
          mkdir -p desktop-sparkquill/resources/configs
          cp agent_go/configs/mcp_servers_clean.json desktop-sparkquill/resources/configs/mcp_servers_clean.json

      - name: Point Go at the checked-out dependencies
        working-directory: agent_go
        run: |
          go mod edit -replace=github.com/manishiitg/mcpagent=../deps/mcpagent
          go mod edit -replace=github.com/manishiitg/multi-llm-provider-go=../deps/multi-llm-provider-go
          go mod download

      # cgo is REQUIRED: the agent server links the shared speech engine's
      # native libraries (agent_go/pkg/voicestt). A bare GOOS/GOARCH cross-build
      # on this Intel runner would turn cgo off and ship the stub. The script
      # also stages the dylibs into resources/lib, which extraResources carries
      # into the app beside the server.
      - name: Build agent-server (with the speech engine)
        run: |
          bash scripts/build-darwin-voice-binary.sh agent_go desktop-sparkquill/resources/agent-server arm64

      - name: Build workspace-server
        working-directory: workspace
        run: |
          go mod download
          GOOS=darwin GOARCH=arm64 go build -o ../desktop-sparkquill/resources/workspace-server .

      # package.json links agentworks-desktop-lib as file:../desktop/lib; npm ci
      # resolves that link from the checkout and installs its dependencies here.
      - name: Install Electron dependencies
        working-directory: desktop-sparkquill
        run: npm ci

      # The unit-test step below also runs ../desktop's own suite directly
      # (`cd ../desktop && npm test`) to check the shared desktop/lib code
      # from both consumers — but desktop-sparkquill's npm ci only populates
      # desktop-sparkquill/node_modules, never desktop/node_modules. A fresh
      # CI checkout of desktop/ has no node_modules at all, so its own
      # dependencies (detect-port, required by desktop/lib/servers.js) were
      # never installed and the test failed with MODULE_NOT_FOUND on every
      # run — this step was simply missing.
      - name: Install AgentWorks desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run the shell's unit tests
        working-directory: desktop-sparkquill
        run: |
          npm test
          (cd ../desktop && npm test)

      # Version must be synced BEFORE the build, tag push or not — it drives
      # both the dist/ filenames (SparkQuill-<version>-arm64.dmg) and the
      # in-app version string (main.js's cache-busting query param).
      - name: Sync the version to the tag
        if: startsWith(github.ref, 'refs/tags/sparkquill-v')
        working-directory: desktop-sparkquill
        run: |
          VERSION="${GITHUB_REF#refs/tags/sparkquill-v}"
          CURRENT="$(node -p "require('./package.json').version")"
          # npm version errors if the target equals the current one, so only run
          # it when it would actually change something.
          if [ "$VERSION" != "$CURRENT" ]; then
            npm version "$VERSION" --no-git-tag-version
          fi

      # Always build locally, never let electron-builder publish itself.
      # electron-builder's GitHub publisher derives its OWN release tag from
      # package.json's version (`v<version>`) and ignores the actual git ref —
      # in this repo that bare `v<version>` tag can collide with an unrelated
      # AgentWorks release (this repo's other app, tagged plain `v*`), which is
      # exactly the collision the `sparkquill-v*` namespace was meant to avoid.
      # Publishing explicitly below, against the real tag, sidesteps that.
      - name: Build the app
        working-directory: desktop-sparkquill
        run: npx electron-builder --mac --arm64 --publish never

      - name: Upload the artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/sparkquill-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: sparkquill-dmg
          path: |
            desktop-sparkquill/dist/*.dmg
            desktop-sparkquill/dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/sparkquill-v')
        working-directory: desktop-sparkquill
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" dist/*.dmg dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "SparkQuill $TAG" \
            --notes "Automated SparkQuill desktop build."
