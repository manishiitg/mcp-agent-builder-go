name: Build Video Studio agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-agent:
    name: Build Linux amd64 agent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check out matching MCP bridge runtime
        uses: actions/checkout@v4
        with:
          repository: manishiitg/mcpagent
          ref: de7ef672f5e0ce2ffe68e5419ec1928236445a5f
          path: dependencies/mcpagent

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: |
            go.work.sum
            mcp-agent-builder-go/agent_go/go.sum
            mcpagent/go.sum

      - name: Build Video Studio agent
        working-directory: agent_go
        run: |
          # Retained-turn support is in the checked-out MCP runtime, which has
          # not been released in the pinned public module yet.
          go mod edit -replace github.com/manishiitg/mcpagent=../dependencies/mcpagent
          go mod edit -dropreplace github.com/manishiitg/multi-llm-provider-go
          go mod tidy
          go build -o ../dist/video-studio-agent .

      - name: Upload Linux agent
        uses: actions/upload-artifact@v4
        with:
          name: video-studio-agent-linux-amd64
          path: dist/video-studio-agent
          if-no-files-found: error
          retention-days: 7
